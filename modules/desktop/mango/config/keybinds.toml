# Keybinds
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

[bind.default]
# Reload config
"SUPER+SHIFT+r" = "reload_config"

# Your favorite applications.
"SUPER+t" = "spawn,kitty"
"SUPER+e" = "spawn,dolphin"
"SUPER+b" = "spawn,zen-beta"
"SUPER+q" = "killclient"
"SUPER+SHIFT+q" = "killclient,force"

# Noctalia specific keybinds.
# "ALT+Tab" = "spawn,noctalia msg window-switcher"
"SUPER+space" = "spawn,noctalia msg panel-toggle launcher"
"SUPER+s" = "spawn,noctalia msg panel-toggle control-center"
"SUPER+SHIFT+s" = "spawn,noctalia msg settings-toggle"
"SUPER+w" = "spawn,noctalia msg panel-toggle wallpaper"
"SUPER+SHIFT+w" = "spawn,noctalia msg panel-toggle noctalia/wallhaven:browser"
# "SUPER+SHIFT+g" = "spawn,noctalia msg panel-toggle leo/game-launcher:browser"
# "SUPER+SHIFT+l" = "spawn,noctalia msg panel-toggle yogaeru/mango_layout:main"
"SUPER+c" = "spawn,noctalia msg panel-toggle clipboard"
"SUPER+x" = "spawn,noctalia msg panel-toggle session"

# Screenshots
"SUPER+p" = "spawn,noctalia msg screenshot-region"
"SUPER+SHIFT+p" = "spawn,noctalia msg screenshot-fullscreen"
"SUPER+ALT+p" = "spawn,noctalia msg screenshot-fullscreen all"

# Audio controls
"NONE+XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
"NONE+XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
"NONE+XF86AudioMute" = "spawn,noctalia msg volume-mute"

# Brightness controls
"NONE+XF86MonBrightnessUp" = "spawn,noctalia msg brightness-up"
"NONE+XF86MonBrightnessDown" = "spawn,noctalia msg brightness-down"

# Switch window focus
# "SUPER+Tab" = "focusstack,next"
# "SUPER+SHIFT+Tab" = "focusstack,prev"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# Swap window
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+l" = "exchange_client,right"

# Switch window status
# "ALT+Tab" = "togglejump"
# "ALT+Tab" = "toggleoverview,0"
"ALT+Tab" = "overcircle,next"
"ALT+SHIFT+Tab" = "overcircle,prev"
"SUPER+g" = "toggleglobal"
"SUPER+o" = "toggleoverlay"
"SUPER+v" = "togglefloating"
"SUPER+SHIFT+v" = "toggle_all_floating"
"SUPER+f" = "togglemaximizescreen"
"SUPER+SHIFT+f" = "togglefullscreen"
"SUPER+ALT+f" = "togglefakefullscreen"
"SUPER+i" = "minimized"
"SUPER+SHIFT+I" = "restore_minimized"
"SUPER+z" = "toggle_scratchpad"

# Scroller layout
# "SUPER+SHIFT+e" = "set_proportion,1.0"
# "SUPER+x" = "switch_proportion_preset"
"SUPER+SHIFT+e" = "switch_proportion_preset"

# Switch layout
# tile, scroller, grid, deck, monocle,
# center_tile, vertical_tile, right_tile,
# vertical_scroller, dwindle, fair,
# vertical_fair, vertical_grid, vertical_deck
# "SUPER+n" = "setkeymode,selectlayout"
# "SUPER+n" = "switch_layout"
# "SUPER+t" = "setlayout,tile"
# "SUPER+SHIFT+t" = "setlayout,vertical_tile"
# "SUPER+c" = "setlayout,center_tile"
# "SUPER+s" = "setlayout,scroller"
# "SUPER+SHIFT+s" = "setlayout,vertical_scroller"
# "SUPER+g" = "setlayout,grid"
# "SUPER+SHIFT+g" = "setlayout,vertical_grid"
# "SUPER+d" = "setlayout,dwindle"
# "SUPER+f" = "setlayout,fair"
# "SUPER+SHIFT+f" = "setlayout,vertical_fair"
# "SUPER+k" = "setlayout,deck"
# "SUPER+SHIFT+k" = "setlayout,vertical_deck"
# "SUPER+m" = "setlayout,monocle"
# "SUPER+escape" = "setkeymode,default"

# Switch between workspaces
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
# "SUPER+0" = "view,0,0"
"SUPER+0" = "toggle_special_tag"
"SUPER+Tab" = "view,-1,0"
# "SUPER+Tab" = "viewtoright_have_client"
# "SUPER+SHIFT+Tab" = "viewtoleft_have_client"
"SUPER+CTRL+Right" = "viewtoright"
"SUPER+CTRL+Left" = "viewtoleft"

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g. "SUPER+SHIFT+1" = "tagsilent,1"
"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"
# "SUPER+SHIFT+0" = "tag,0,0"
"SUPER+SHIFT+0" = "tag_special_tag"
"CTRL+SUPER+1" = "toggletag,1"
"CTRL+SUPER+2" = "toggletag,2"
"CTRL+SUPER+3" = "toggletag,3"
"CTRL+SUPER+4" = "toggletag,4"
"CTRL+SUPER+5" = "toggletag,5"
"CTRL+SUPER+6" = "toggletag,6"
"CTRL+SUPER+7" = "toggletag,7"
"CTRL+SUPER+8" = "toggletag,8"
"CTRL+SUPER+9" = "toggletag,9"
"CTRL+SUPER+0" = "toggletag,0"

# Switch between monitors
"SUPER+ALT+Left" = "focusmon,left"
"SUPER+ALT+Right" = "focusmon,right"
"SUPER+ALT+Up" = "focusmon,up"
"SUPER+ALT+Down" = "focusmon,down"

# Move window to another monitor
"SUPER+SHIFT+ALT+Left" = "tagmon,left"
"SUPER+SHIFT+ALT+Right" = "tagmon,right"
"SUPER+SHIFT+ALT+Up" = "tagmon,up"
"SUPER+SHIFT+ALT+Down" = "tagmon,down"

# Movewin
# "SUPER+CTRL+k" = "movewin,+0,-50"
# "SUPER+CTRL+j" = "movewin,+0,+50"
# "SUPER+CTRL+h" = "movewin,-50,+0"
# "SUPER+CTRL+l" = "movewin,+50,+0"
"SUPER+CTRL+k" = "smartmovewin,up"
"SUPER+CTRL+j" = "smartmovewin,down"
"SUPER+CTRL+h" = "smartmovewin,left"
"SUPER+CTRL+l" = "smartmovewin,right"

# Resizewin
"SUPER+CTRL+SHIFT+k" = "resizewin,+0,-50"
"SUPER+CTRL+SHIFT+j" = "resizewin,+0,+50"
"SUPER+CTRL+SHIFT+h" = "resizewin,-50,+0"
"SUPER+CTRL+SHIFT+l" = "resizewin,+50,+0"
# "SUPER+CTRL+SHIFT+k" = "smartresizewin,up"
# "SUPER+CTRL+SHIFT+j" = "smartresizewin,down"
# "SUPER+CTRL+SHIFT+h" = "smartresizewin,left"
# "SUPER+CTRL+SHIFT+l" = "smartresizewin,right"
"SUPER+r" = "setkeymode,resizemode"
"SUPER+escape" = "setkeymode,default"

[bind.resizemode]
"SUPER+k" = "resizewin,+0,-50"
"SUPER+j" = "resizewin,+0,+50"
"SUPER+h" = "resizewin,-50,+0"
"SUPER+l" = "resizewin,+50,+0"
"SUPER+escape" = "setkeymode,default"

[bind.resizemode.release]
"SUPER+r" = "setkeymode,default"

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"NONE+btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
"SUPER+CTRL+UP" = "focusdir,left"
"SUPER+CTRL+DOWN" = "focusdir,right"
"SHIFT+SUPER+UP" = "exchange_client,left"
"SHIFT+SUPER+DOWN" = "exchange_client,right"

[gesturebind.default]
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+left+4" = "viewtoleft"
"none+right+4" = "viewtoright"
"none+up+4" = "toggleoverview,1"
"none+down+4" = "toggleoverview,1"
