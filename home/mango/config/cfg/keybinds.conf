# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Reload config
bind = SUPER+SHIFT, r, reload_config

# Your favorite applications.
bind = SUPER, Return, spawn, kitty
bind = SUPER, e, spawn, dolphin
bind = SUPER, b, spawn, zen-beta
# bind = SUPER, z, spawn, zeditor

bind = SUPER, q, killclient,
bind = SUPER+CTRL+SHIFT, q, quit

# Noctalia specific keybinds.
# bind = Alt, Tab, spawn, noctalia msg window-switcher
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center
bind = SUPER+SHIFT, s, spawn, noctalia msg settings-toggle
bind = SUPER, w, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser
bind = SUPER+SHIFT, g, spawn, noctalia msg panel-toggle leo/game-launcher:browser
# bind = SUPER+SHIFT, l, spawn, noctalia msg panel-toggle yogaeru/mango_layout:main
bind = SUPER, c, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, x, spawn, noctalia msg panel-toggle session

# Screenshots
bind = SUPER, p, spawn, noctalia msg screenshot-region
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER+SHIFT, Tab, focusstack, prev
bind = SUPER, h, focusdir, left
bind = SUPER, l, focusdir, right
bind = SUPER, k, focusdir, up
bind = SUPER, j, focusdir, down

# Swap window
bind = SUPER+SHIFT, k, exchange_client, up
bind = SUPER+SHIFT, j, exchange_client, down
bind = SUPER+SHIFT, h, exchange_client, left
bind = SUPER+SHIFT, l, exchange_client, right

# Switch window status
bind = ALT, Tab, toggleoverview, 0
# bind = ALT, Tab, togglejump,
bind = SUPER, g, toggleglobal,
bind = SUPER, o, toggleoverlay,
bind = SUPER, v, togglefloating,
bind = SUPER+SHIFT, v, toggle_all_floating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_scratchpad

# Scroller layout
# bind = SUPER+SHIFT, e, set_proportion, 1.0
# bind = SUPER, x, switch_proportion_preset,
bind = SUPER+SHIFT, e, switch_proportion_preset

# Switch layout
# tile, scroller, grid, deck, monocle,
# center_tile, vertical_tile, right_tile,
# vertical_scroller, dwindle, fair,
# vertical_fair, vertical_grid, vertical_deck

bind = SUPER, n, setkeymode, selectlayout
bindr = SUPER, n, setkeymode, default
keymode = selectlayout
bind = SUPER, t, setlayout, tile
bind = SUPER, t, setkeymode, default
bind = SUPER+SHIFT, t, setlayout, vertical_tile
bind = SUPER+SHIFT, t, setkeymode, default
bind = SUPER, c, setlayout, center_tile
bind = SUPER, c, setkeymode, default
bind = SUPER, s, setlayout, scroller
bind = SUPER, s, setkeymode, default
bind = SUPER+SHIFT, s, setlayout, vertical_scroller
bind = SUPER+SHIFT, s, setkeymode, default
bind = SUPER, g, setlayout, grid
bind = SUPER, g, setkeymode, default
bind = SUPER+SHIFT, g, setlayout, vertical_grid
bind = SUPER+SHIFT, g, setkeymode, default
bind = SUPER, d, setlayout, dwindle
bind = SUPER, d, setkeymode, default
bind = SUPER, f, setlayout, fair
bind = SUPER, f, setkeymode, default
bind = SUPER+SHIFT, f, setlayout, vertical_fair
bind = SUPER+SHIFT, f, setkeymode, default
bind = SUPER, k, setlayout, deck
bind = SUPER, k, setkeymode, default
bind = SUPER+SHIFT, k, setlayout, vertical_deck
bind = SUPER+SHIFT, k, setkeymode, default
bind = SUPER, m, setlayout, monocle
bind = SUPER, m, setkeymode, default
bindr = SUPER, setkeymode, default
bind = SUPER, escape, setkeymode, default
keymode = default

# Switch between workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0
bind = SUPER, 0, view, 0, 0
# bind = SUPER, 0, toggleoverview
# bind = SUPER, Tab, view, -1, 0
# bind = SUPER, Tab, viewtoright_have_client
# bind = SUPER+SHIFT, Tab, viewtoleft_have_client
bind = SUPER+CTRL, Right, viewtoright
bind = SUPER+CTRL, Left, viewtoleft

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g bind = SUPER+SHIFT, 1, tagsilent, 1
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

bind=CTRL+SUPER,1,toggletag,1
bind=CTRL+SUPER,2,toggletag,2
bind=CTRL+SUPER,3,toggletag,3
bind=CTRL+SUPER,4,toggletag,4
bind=CTRL+SUPER,5,toggletag,5
bind=CTRL+SUPER,6,toggletag,6
bind=CTRL+SUPER,7,toggletag,7
bind=CTRL+SUPER,8,toggletag,8
bind=CTRL+SUPER,9,toggletag,9

# Switch between monitors
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor
bind = SUPER+ALT, Left, tagmon, left
bind = SUPER+ALT, Right, tagmon, right

# Gaps
# bind = SUPER+SHIFT, X, incgaps, 1
# bind = SUPER+SHIFT, Z, incgaps, -1
# bind = SUPER+SHIFT, R, togglegaps

# Movewin
# bind = SUPER+CTRL, k, movewin, +0, -50
# bind = SUPER+CTRL, j, movewin, +0, +50
# bind = SUPER+CTRL, h, movewin, -50,+0
# bind = SUPER+CTRL, l, movewin, +50,+0
bind = SUPER+CTRL, k, smartmovewin, up
bind = SUPER+CTRL, j, smartmovewin, down
bind = SUPER+CTRL, h, smartmovewin, left
bind = SUPER+CTRL, l, smartmovewin, right

# Resizewin
bind = SUPER+CTRL+SHIFT, k, resizewin, +0, -50
bind = SUPER+CTRL+SHIFT, j, resizewin, +0, +50
bind = SUPER+CTRL+SHIFT, h, resizewin, -50, +0
bind = SUPER+CTRL+SHIFT, l, resizewin, +50, +0
# bind = SUPER+CTRL+SHIFT, k, smartresizewin, up
# bind = SUPER+CTRL+SHIFT, j, smartresizewin, down
# bind = SUPER+CTRL+SHIFT, h, smartresizewin, left
# bind = SUPER+CTRL+SHIFT, l, smartresizewin, right

bind = SUPER, r, setkeymode, resizemode
keymode = resizemode

bind = SUPER, k, resizewin, +0, -50
bind = SUPER, j, resizewin, +0, +50
bind = SUPER, h, resizewin, -50, +0
bind = SUPER, l, resizewin, +50, +0
# bindr = SUPER, setkeymode, default
bindr = SUPER, r, setkeymode, default

bind = SUPER, escape, setkeymode, default
keymode = default

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=alt,UP,focusdir,left
axisbind=alt,DOWN,focusdir,right
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft
gesturebind=none,right,4,viewtoright
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1
