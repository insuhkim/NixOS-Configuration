# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

# Keyboard Settings
repeat_rate=40
repeat_delay=400
numlockon=0
xkb_rules_layout=us
xkb_rules_options=caps:escape,ctrl:nocaps


# Mouse Settings
mouse_natural_scrolling = 0
mouse_accel_profile = 2
mouse_accel_speed = 0.0
left_handed = 0
axis_scroll_factor = 1.0

# Trackpad Settings
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
trackpad_natural_scrolling = 0
trackpad_accel_profile = 2
trackpad_accel_speed = 0.0
scroll_button = 274
scroll_method = 1
click_method = 1
send_events_mode = 0
drag_lock = 1
disable_while_typing = 1
left_handed = 0
middle_button_emulation = 0
swipe_min_threshold = 1
button_map = 0
trackpad_scroll_factor = 0.6

# If you want to disable pointer acceleration, uncomment the lines below.
# accel_profile = 1
# accel_speed = 0.2
